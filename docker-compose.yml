services:

  backend:
    build:
      context: ./backend
    container_name: erp-backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      BACKUP_DIR: ${BACKUP_DIR:-/tmp/erp-2ig-backups}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/tmp/erp-2ig-logs}
    ports:
      - "4000:4000"
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
    container_name: erp-frontend
    restart: always
    expose:
      - "80"
    networks:
      - erp-network
    depends_on:
      - backend

  # HTTPS sur le port 8080 (l'ancien port HTTP) (certificat Let's Encrypt via DNS Porkbun) : https://${DOMAIN}
  caddy:
    build:
      context: ./caddy
    container_name: erp-caddy
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-yakro.roxgold-sitelife.com}
      PORKBUN_API_KEY: ${PORKBUN_API_KEY:-}
      PORKBUN_API_SECRET_KEY: ${PORKBUN_API_SECRET_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - erp-network
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  erp-network:
    external: true
