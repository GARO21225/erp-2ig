services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: erp-2ig-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    nodeVersion: 20.18.0
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && node src/seed.js
    startCommand: node src/index.js
    plan: starter
    disk:
      name: erp-2ig-storage
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKUP_DIR
        value: /data/backups
      - key: GED_UPLOAD_DIR
        value: /data/uploads/ged
      - key: BACKUP_RETENTION_DAILY
        value: "7"

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: erp-2ig-frontend
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
